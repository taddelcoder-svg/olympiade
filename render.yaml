# Render-Blueprint: ein Docker-Webdienst. Das Passwort muss dasselbe sein wie bei den Spielen,
# denn daraus werden auch die Olympia-Tickets signiert.
services:
  - type: web
    name: olympiade
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: ZUGANG_PASSWORT
        sync: false
